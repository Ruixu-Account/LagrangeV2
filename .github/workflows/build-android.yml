name: Build Lagrange.Core NativeAPI for Android arm64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android NDK r27
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip
          echo "ANDROID_NDK_ROOT=$PWD/android-ndk-r27c" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r27c" >> $GITHUB_ENV

      - name: Publish NativeAPI for Android arm64
        run: |
          dotnet publish Lagrange.Core.NativeAPI/Lagrange.Core.NativeAPI.csproj \
            -r linux-bionic-arm64 \
            -c Release \
            -p:NativeLib=Shared

      - name: List output
        run: |
          find Lagrange.Core.NativeAPI/bin/Release -name "*.so" -exec ls -lh {} \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lagrange-nativeapi-android-arm64
          path: Lagrange.Core.NativeAPI/bin/Release/net10.0/linux-bionic-arm64/publish/*.so
