name: Build Lagrange.Core NativeAPI for Android arm64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK (11 preview)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Add dotnet11 daily feed
        run: |
          dotnet nuget add source \
            https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet11/nuget/v3/index.json \
            -n dotnet11

      - name: Install Android NDK r27c
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip
          echo "ANDROID_NDK_ROOT=$PWD/android-ndk-r27c" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r27c" >> $GITHUB_ENV
          echo "$PWD/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Restore with RID
        run: |
          dotnet restore Lagrange.Core.NativeAPI \
            -r linux-bionic-arm64

      - name: Publish with Native AOT (Android arm64)
        run: |
          dotnet publish Lagrange.Core.NativeAPI \
            -c Release \
            -r linux-bionic-arm64 \
            -p:NativeLib=Shared \
            --no-restore

      - name: List output
        run: |
          find Lagrange.Core.NativeAPI/bin/Release -name "*.so" -exec ls -lh {} \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lagrange.Core.NativeAPI-linux-bionic-arm64
          path: Lagrange.Core.NativeAPI/bin/Release/net11.0/linux-bionic-arm64/publish/*.so
